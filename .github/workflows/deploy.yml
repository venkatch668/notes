name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Declared so the job can read variables scoped to this environment.
    # `vars.*` only resolves repository/organisation variables plus those of the
    # environment a job declares — an environment-scoped variable is invisible
    # to a job without this line, and silently reads as empty rather than
    # failing, which ships the app in local mode.
    environment: github-pages
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Report which build-time variables arrived, without printing values.
      # A missing variable does not fail the build — it silently ships the app
      # in local mode, which looks like "my changes didn't deploy". Saying so
      # here turns a confusing symptom into an obvious log line.
      - name: Check build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_URL; do
            if [ -n "${!name}" ]; then
              echo "  set     $name (${#name} char name, value hidden)"
            else
              echo "  MISSING $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning::Some VITE_* repository *variables* are unset, so this build ships in LOCAL mode (localStorage, no login). Set them under Settings > Secrets and variables > Actions > Variables tab — not Secrets."
          else
            echo "All three set: building in SERVER mode (Supabase auth + API)."
          fi

      - run: npm run build
        env:
          # Repo is served at https://<user>.github.io/notes/.
          # Change to "/" if this ever moves to a custom root domain.
          BASE_PATH: /notes/

          # Vite inlines VITE_* at build time, so these must be present here
          # rather than configured at runtime. Set them under
          # Settings → Secrets and variables → Actions.
          #
          # If they are absent the build still succeeds and the app ships in
          # local mode (localStorage, no login) — which is the behaviour the
          # published site has today. Auth and sync switch on only once all
          # three are set.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # e.g. https://work-notebook-api.onrender.com/api/v1
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
