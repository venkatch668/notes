# Render blueprint — infrastructure as code.
#
# Deploying from this file rather than clicking through the dashboard means the
# service definition is reviewable, diffable and reproducible. Secrets are the
# only thing deliberately not in here.
#
# Setup: Render → New → Blueprint → point at this repo → fill the values marked
# `sync: false` from your Supabase project.

services:
  - type: web
    name: work-notebook-api
    runtime: python
    plan: free
    # Supabase project is in ap-south-1 (Mumbai). Singapore is Render's closest
    # region, which keeps the database round trip to roughly one hop.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # `bash start.sh` rather than `./start.sh`: it works whether or not the
    # executable bit survives the checkout.
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Free instances have 512 MB; two uvicorn workers fit comfortably.
      - key: WEB_CONCURRENCY
        value: "2"

      # Supabase → Settings → Database → Connection string → URI.
      # MUST be the pooler host on port 6543:
      #   - the direct host (db.<ref>.supabase.co) is IPv6-only and Render is
      #     IPv4, so it cannot resolve at all
      #   - db.py detects 6543 and applies the PgBouncer-safe settings
      # Remember to percent-encode special characters in the password
      # (@ -> %40, ! -> %21).
      - key: DATABASE_URL
        sync: false

      # Supabase → Settings → API → Project URL.
      # The JWKS endpoint is derived from this; no API key of any kind is
      # needed, because this service only *verifies* tokens.
      - key: SUPABASE_URL
        sync: false

      # Google AI Studio → Get API key. Server-side only: a key in the browser
      # bundle is a key anyone can read and spend. Leaving this unset simply
      # switches the hosted assistant off — the app falls back to the local
      # extractive provider rather than breaking.
      - key: GEMINI_API_KEY
        sync: false

      # Where the browser app is served from. The GitHub Pages origin must be
      # listed or every request from the deployed UI fails CORS preflight.
      - key: CORS_ORIGINS
        value: https://venkatch668.github.io,http://localhost:5173
